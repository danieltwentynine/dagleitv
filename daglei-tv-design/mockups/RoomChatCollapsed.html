*,*::before,*::after{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:var(--void,#0a0a0b);color:var(--ink,#f2efe6);font-family:var(--font-mono,"JetBrains Mono", ui-monospace, Consolas, monospace);font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit;border-radius:0}
a{color:var(--brand,#ff4b1f)}
.up{text-transform:uppercase}
.dim{color:var(--ink-dim,#b4b1a8)}.mute{color:var(--ink-mute,#908d85)}.brand{color:var(--brand,#ff4b1f)}.caut{color:var(--caution,#ffd60a)}
.mono{font-family:var(--font-mono,"JetBrains Mono", ui-monospace, Consolas, monospace)}.disp{font-family:var(--font-display,"Big Shoulders Display", "Arial Narrow", Impact, sans-serif);text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- the cut: one signature shape. --tl/--tr/--br/--bl are 0 or 1 flags ---- */
.cut{--b:var(--stroke-1,1px);--bd:var(--line-strong,#8a8a92);--fill:var(--panel,#131315);--tl:0;--tr:0;--br:0;--bl:0;
  --ci:calc(var(--cut,12px) - var(--b) * .5858);
  position:relative;isolation:isolate;background:var(--bd);
  clip-path:polygon(calc(var(--tl)*var(--cut,12px)) 0,calc(100% - var(--tr)*var(--cut,12px)) 0,100% calc(var(--tr)*var(--cut,12px)),100% calc(100% - var(--br)*var(--cut,12px)),calc(100% - var(--br)*var(--cut,12px)) 100%,calc(var(--bl)*var(--cut,12px)) 100%,0 calc(100% - var(--bl)*var(--cut,12px)),0 calc(var(--tl)*var(--cut,12px)))}
.cut::before{content:"";position:absolute;inset:var(--b);z-index:-1;background:var(--fill);
  clip-path:polygon(calc(var(--tl)*var(--ci)) 0,calc(100% - var(--tr)*var(--ci)) 0,100% calc(var(--tr)*var(--ci)),100% calc(100% - var(--br)*var(--ci)),calc(100% - var(--br)*var(--ci)) 100%,calc(var(--bl)*var(--ci)) 100%,0 calc(100% - var(--bl)*var(--ci)),0 calc(var(--tl)*var(--ci)))}
.c-s{--cut:var(--cut-s,6px)}
.c-tr{--tr:1}.c-bl{--bl:1}.c-tl{--tl:1}.c-br{--br:1}
.c-diag{--tr:1;--bl:1}.c-anti{--tl:1;--br:1}.c-r{--tr:1;--br:1}
.f-void{--fill:var(--void,#0a0a0b)}.f-panel{--fill:var(--panel,#131315)}.f-raised{--fill:var(--raised,#1c1c1f)}.f-brand{--fill:var(--brand,#ff4b1f);--bd:var(--brand,#ff4b1f)}.f-caution{--fill:var(--caution,#ffd60a);--bd:var(--caution,#ffd60a)}.f-stage{--fill:var(--stage,#000000)}
.b-line{--bd:var(--line,#2b2b30)}.b-strong{--bd:var(--line-strong,#8a8a92)}.b-ink{--bd:var(--ink,#f2efe6)}.b-brand{--bd:var(--brand,#ff4b1f)}.b-none{--b:0px;--bd:transparent}
.b-2{--b:var(--stroke-2,2px)}
.is-focus{--bd:var(--focus,#ffffff)!important;--b:3px!important}
.cut:focus-visible,.cut:focus-within.focus-in{--bd:var(--focus,#ffffff);--b:3px;outline:none}

/* ---- text ---- */
.t-label{text-transform:uppercase}
.rule{height:var(--stroke-1,1px);background:var(--line,#2b2b30);border:0;margin:0}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2,8px);min-height:var(--control-h,40px);padding:0 var(--space-4,16px);cursor:pointer;
  font-family:var(--font-mono,"JetBrains Mono", ui-monospace, Consolas, monospace);font-size:12px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink,#f2efe6);text-decoration:none;white-space:nowrap;
  --tr:1;--bl:1;--fill:var(--void,#0a0a0b);--bd:var(--line-strong,#8a8a92);border:0;background:var(--bd)}
.btn:hover{--fill:var(--raised,#1c1c1f);--bd:var(--ink,#f2efe6)}
.btn:active{--fill:var(--panel,#131315)}
.btn-primary{--fill:var(--brand,#ff4b1f);--bd:var(--brand,#ff4b1f);color:var(--on-brand,#0a0a0b)}
.btn-primary:hover{--fill:var(--brand-hot,#ff6b45);--bd:var(--brand-hot,#ff6b45)}
.btn-primary:active{--fill:var(--brand-press,#e03a10);--bd:var(--brand-press,#e03a10)}
.btn-ghost{--fill:transparent;--bd:transparent;color:var(--ink-dim,#b4b1a8)}
.btn-ghost:hover{--fill:var(--raised,#1c1c1f);--bd:var(--raised,#1c1c1f);color:var(--ink,#f2efe6)}
.btn-caution{--fill:var(--on-caution,#0a0a0b);--bd:var(--on-caution,#0a0a0b);color:var(--caution,#ffd60a)}
.btn-caution:hover{--fill:var(--void,#0a0a0b);--bd:var(--void,#0a0a0b)}
.btn-lg{min-height:56px;padding:0 var(--space-5,24px);font-size:14px;letter-spacing:.12em}
.btn-sm{min-height:var(--hit-min,32px);padding:0 var(--space-3,12px)}
.btn[disabled],.btn[aria-disabled=true]{cursor:not-allowed;color:var(--ink-mute,#908d85);--fill:var(--panel,#131315);--bd:var(--line,#2b2b30)}
.btn[aria-pressed=true]{--bd:var(--ink,#f2efe6);--fill:var(--raised,#1c1c1f);color:var(--ink,#f2efe6)}
.btn:focus-visible{--bd:var(--focus,#ffffff);--b:3px;outline:none}
.ibtn{width:var(--control-h,40px);height:var(--control-h,40px);padding:0;--tr:1;--bl:0;--cut:var(--cut-s,6px)}
.ibtn.btn{min-height:var(--control-h,40px)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:miter;stroke-linecap:square}
.ic-sm{width:16px;height:16px}

/* ---- inputs ---- */
.input{display:flex;align-items:center;min-height:var(--control-h,40px);padding:0 var(--space-3,12px);--bl:1;--fill:var(--raised,#1c1c1f);--bd:var(--line-strong,#8a8a92);gap:var(--space-2,8px);background:var(--bd)}
.input:focus-within{--bd:var(--focus,#ffffff);--b:3px}
.input input,.input textarea{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--ink,#f2efe6);font-family:var(--font-mono,"JetBrains Mono", ui-monospace, Consolas, monospace);font-size:14px;line-height:22px;padding:0;resize:none}
.input input::placeholder,.input textarea::placeholder{color:var(--ink-mute,#908d85);opacity:1}
.input .pre{color:var(--ink-mute,#908d85);font-weight:700}
.input.err{--bd:var(--caution,#ffd60a)}

/* ---- tags ---- */
.tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 var(--space-2,8px);--cut:var(--cut-s,6px);--tr:1;--fill:var(--void,#0a0a0b);--bd:var(--line-strong,#8a8a92);
  font-size:12px;line-height:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;background:var(--bd)}
.tag-live{--fill:var(--brand,#ff4b1f);--bd:var(--brand,#ff4b1f);color:var(--on-brand,#0a0a0b)}
.tag-warn{--fill:var(--caution,#ffd60a);--bd:var(--caution,#ffd60a);color:var(--on-caution,#0a0a0b)}
.tag-ok{--fill:var(--void,#0a0a0b);--bd:var(--ink,#f2efe6);color:var(--ink,#f2efe6)}
.tag-mute{--bd:var(--line-strong,#8a8a92);color:var(--ink-dim,#b4b1a8)}
.dot{display:inline-block;width:8px;height:8px;background:currentColor;flex:none}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;--cut:var(--cut-s,6px);--tr:1;--fill:var(--brand,#ff4b1f);--bd:var(--brand,#ff4b1f);color:var(--on-brand,#0a0a0b);font-size:12px;line-height:16px;font-weight:700;background:var(--bd)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;--cut:var(--cut-s,6px);--tr:1;--fill:var(--void,#0a0a0b);--bd:var(--line-strong,#8a8a92);font-size:12px;font-weight:700;color:var(--ink,#f2efe6);background:var(--bd)}

/* ---- banners, tooltips, popovers ---- */
.banner{display:flex;align-items:center;gap:var(--space-4,16px);padding:var(--space-3,12px) var(--space-4,16px);--bl:1;--tr:1;--fill:var(--raised,#1c1c1f);--bd:var(--line-strong,#8a8a92);background:var(--bd)}
.banner .msg-t{flex:1}
.banner-warn{--fill:var(--caution,#ffd60a);--bd:var(--caution,#ffd60a);color:var(--on-caution,#0a0a0b)}
.banner-warn .btn{--fill:var(--on-caution,#0a0a0b);--bd:var(--on-caution,#0a0a0b);color:var(--caution,#ffd60a)}
.banner-warn .btn:hover{--fill:var(--void,#0a0a0b);--bd:var(--void,#0a0a0b)}
.banner b{font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tip{display:inline-block;padding:var(--space-1,4px) var(--space-3,12px);--cut:var(--cut-s,6px);--tl:1;--fill:var(--raised,#1c1c1f);--bd:var(--ink,#f2efe6);font-size:12px;line-height:20px;color:var(--ink,#f2efe6);background:var(--bd);white-space:nowrap}
.pop{padding:var(--space-4,16px);--tr:1;--bl:1;--fill:var(--raised,#1c1c1f);--bd:var(--ink,#f2efe6);background:var(--bd)}
.pop h4{margin:0 0 var(--space-3,12px);font-size:12px;line-height:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim,#b4b1a8)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:var(--space-2,8px) var(--space-4,16px);align-items:center}

/* ---- sliders + segmented ---- */
.slider{position:relative;width:96px;height:var(--hit-min,32px);display:flex;align-items:center}
.slider::before{content:"";position:absolute;left:0;right:0;height:var(--stroke-2,2px);background:var(--line-strong,#8a8a92)}
.slider i{position:absolute;left:0;height:var(--stroke-2,2px);background:var(--ink,#f2efe6)}
.slider b{position:absolute;top:6px;width:10px;height:20px;margin-left:-5px;background:var(--ink,#f2efe6);clip-path:polygon(0 0,100% 0,100% 70%,50% 100%,0 70%)}
.seg{display:inline-flex}
.seg .btn{--tr:0;--bl:0;min-height:var(--hit-min,32px);--cut:var(--cut-s,6px)}
.seg .btn:first-child{--bl:1}.seg .btn:last-child{--tr:1}
.seg .btn+.btn{margin-left:-1px}

/* ---- chat ---- */
.chat{display:flex;flex-direction:column;background:var(--panel,#131315);border-left:var(--stroke-1,1px) solid var(--line,#2b2b30);min-height:0}
.chat-h{display:flex;align-items:center;justify-content:space-between;height:var(--bar-h,44px);padding:0 var(--space-4,16px);border-bottom:var(--stroke-1,1px) solid var(--line,#2b2b30);flex:none}
.chat-note{padding:var(--space-2,8px) var(--space-4,16px);border-bottom:var(--stroke-1,1px) solid var(--line,#2b2b30);color:var(--ink-mute,#908d85);font-size:12px;line-height:16px;flex:none}
.chat-l{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:var(--space-3,12px);padding:var(--space-4,16px);min-height:0}
.msg{max-width:88%;display:flex;flex-direction:column;gap:2px}
.msg .m{font-size:12px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute,#908d85)}
.msg .m b{font-weight:700;margin-right:var(--space-2,8px)}
.msg .x{padding:var(--space-2,8px) var(--space-3,12px);white-space:pre-wrap;word-break:break-word}
.msg.them{align-self:flex-start}
.msg.them .m b{color:var(--ink-dim,#b4b1a8)}
.msg.them .x{--tl:0;--tr:1;--fill:var(--panel,#131315);--bd:var(--line-strong,#8a8a92)}
.msg.me{align-self:flex-end;align-items:flex-end;text-align:left}
.msg.me .m b{color:var(--brand,#ff4b1f)}
.msg.me .x{--bl:1;--fill:var(--raised,#1c1c1f);--bd:var(--raised,#1c1c1f)}
.sysl{display:flex;align-items:center;gap:var(--space-2,8px);color:var(--ink-mute,#908d85);font-size:12px;line-height:16px}
.sysl::before,.sysl::after{content:"";flex:1;height:var(--stroke-1,1px);background:var(--line,#2b2b30)}
.sysl span{white-space:nowrap}
.sysl.ev{color:var(--ink-dim,#b4b1a8)}
.chat-f{flex:none;padding:var(--space-3,12px) var(--space-4,16px) var(--space-4,16px);border-top:var(--stroke-1,1px) solid var(--line,#2b2b30)}
.chat-f .input{--bl:0;--tr:1;align-items:flex-start;padding-top:9px;padding-bottom:9px;min-height:64px}
.chat-f .hint{margin-top:var(--space-2,8px);font-size:12px;line-height:16px;color:var(--ink-mute,#908d85)}
.chat-e{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-4,16px);color:var(--ink-mute,#908d85);text-align:center}

/* ---- ascii ---- */
.ascii{margin:0;font-family:var(--font-mono,"JetBrains Mono", ui-monospace, Consolas, monospace);font-size:14px;line-height:16px;font-weight:500;white-space:pre;color:var(--ink-dim,#b4b1a8);letter-spacing:0;tab-size:1}
.ascii .hl{color:var(--brand,#ff4b1f)}.ascii .wr{color:var(--caution,#ffd60a)}.ascii .bt{color:var(--ink,#f2efe6)}
.ascii-l{font-size:22px;line-height:25px}
.ascii-xl{font-size:28px;line-height:32px}

/* ---- room shell ---- */
.room{display:grid;grid-template-columns:minmax(0,1fr) var(--chat-w,340px);width:100%;height:100%;background:var(--void,#0a0a0b)}
.room.nochat{grid-template-columns:minmax(0,1fr)}
.stagecol{position:relative;background:var(--stage,#000000);overflow:hidden;min-width:0}
.topbar,.strip{position:absolute;left:0;right:0;display:flex;align-items:center;gap:var(--space-3,12px);padding:0 var(--space-4,16px);background:var(--panel,#131315);z-index:var(--z-chrome,10)}
.topbar{top:0;height:var(--bar-h,44px);border-bottom:var(--stroke-1,1px) solid var(--line,#2b2b30)}
.strip{bottom:0;height:var(--strip-h,56px);border-top:var(--stroke-1,1px) solid var(--line,#2b2b30)}
.topbar .sp,.strip .sp{flex:1}
.brandrow{display:flex;align-items:center;gap:var(--space-2,8px);height:100%}
.brandrow svg{height:20px;width:auto;display:block}
.hidden-chrome .topbar,.hidden-chrome .strip{display:none}
.vframe{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);width:100%;aspect-ratio:16/9;background:var(--stage,#000000)}
.vframe.cutf{--b:0px;--tr:1;--bl:1;--fill:var(--stage,#000000);--bd:var(--stage,#000000)}
.gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--space-5,24px);padding:var(--bar-h,44px) var(--space-7,48px) var(--strip-h,56px)}
.gate h1{margin:0}
.gate p{margin:0;max-width:520px;color:var(--ink-dim,#b4b1a8)}
.code{font-size:40px;line-height:48px;font-weight:700;letter-spacing:.14em;color:var(--ink,#f2efe6)}
.overlay{position:absolute;z-index:var(--z-overlay,20)}
.toast{position:absolute;z-index:var(--z-toast,30);max-width:340px;padding:var(--space-3,12px) var(--space-4,16px);--tr:1;--bl:1;--fill:var(--raised,#1c1c1f);--bd:var(--ink,#f2efe6);background:var(--bd)}
.stats{position:absolute;z-index:var(--z-overlay,20);left:var(--space-4,16px);padding:var(--space-3,12px) var(--space-4,16px);--tr:1;--bl:1;--fill:var(--void,#0a0a0b);--bd:var(--line-strong,#8a8a92);font-size:12px;line-height:18px;background:var(--bd);min-width:230px}
.stats div{display:flex;justify-content:space-between;gap:var(--space-5,24px)}
.stats span:first-child{color:var(--ink-mute,#908d85);text-transform:uppercase;letter-spacing:.08em}

@media (prefers-reduced-motion:no-preference){
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

.t-display-l{font-family:var(--font-display,"Big Shoulders Display", "Arial Narrow", Impact, sans-serif);font-size:96px;line-height:88px;font-weight:900;letter-spacing:0.01em;text-transform:uppercase;}
.t-display-m{font-family:var(--font-display,"Big Shoulders Display", "Arial Narrow", Impact, sans-serif);font-size:56px;line-height:56px;font-weight:800;letter-spacing:0.02em;text-transform:uppercase;}
.t-title{font-family:var(--font-display,"Big Shoulders Display", "Arial Narrow", Impact, sans-serif);font-size:28px;line-height:30px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;}
.t-body-lg{font-family:var(--font-mono,"JetBrains Mono", ui-monospace, Consolas, monospace);font-size:16px;line-height:24px;font-weight:400;}
.t-body{font-family:var(--font-mono,"JetBrains Mono", ui-monospace, Consolas, monospace);font-size:14px;line-height:22px;font-weight:400;}
.t-label{font-family:var(--font-mono,"JetBrains Mono", ui-monospace, Consolas, monospace);font-size:12px;line-height:16px;font-weight:700;letter-spacing:0.1em;}
.t-meta{font-family:var(--font-mono,"JetBrains Mono", ui-monospace, Consolas, monospace);font-size:12px;line-height:16px;font-weight:400;letter-spacing:0.02em;}
.t-ascii{font-family:var(--font-mono,"JetBrains Mono", ui-monospace, Consolas, monospace);font-size:14px;line-height:16px;font-weight:500;}
